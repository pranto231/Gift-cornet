<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRANTO GIFT CORNER</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #e0e5ec;
    padding: 20px;
    position: relative;
    overflow: hidden;
}

/* Background Jik-Mik (Sparkling) Effect */
body::before {
    content: ''; 
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background-image: radial-gradient(circle at center, rgba(255,255,255,0.9) 2px, transparent 3px);
    background-size: 80px 80px; 
    background-position: 0 0, 40px 40px;
    animation: softJikmik 2.5s infinite alternate;
    opacity: 0.4; 
    z-index: 0;
}

@keyframes softJikmik {
    0% { opacity: 0.2; transform: scale(0.98); }
    100% { opacity: 0.6; transform: scale(1.02); }
}

/* Neumorphic 3D Card */
.card {
    width: 100%;
    max-width: 400px;
    background: #e0e5ec;
    border-radius: 30px;
    padding: 40px 25px;
    text-align: center;
    box-shadow: 12px 12px 24px rgba(163,177,198,0.6), -12px -12px 24px rgba(255,255,255,0.8);
    animation: up 0.8s ease;
    position: relative;
    z-index: 1;
}

@keyframes up {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
}

/* Neumorphic Logo Container */
.logo {
    width: 110px; height: 110px;
    margin: auto; border-radius: 50%;
    background: #e0e5ec;
    box-shadow: 8px 8px 16px rgba(163,177,198,0.6), -8px -8px 16px rgba(255,255,255,0.8);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; border: 4px solid #e0e5ec;
}
.logo img { width: 100%; height: 100%; object-fit: cover; }

/* Multi-color Placeholder Icon */
.placeholder {
    font-size: 45px;
    background: linear-gradient(45deg, #ff007f, #ff9900);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

/* MULTI-COLOR GRADIENT TEXTS */
h1 {
    margin-top: 25px; 
    font-size: 26px; 
    font-weight: 800;
    background: linear-gradient(45deg, #ff007f, #7928ca, #00d4ff, #ff9900);
    background-size: 300%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: gradientText 5s infinite alternate;
}

@keyframes gradientText {
    0% { background-position: 0% 50%; }
    100% { background-position: 100% 50%; }
}

.subtitle {
    margin-top: 10px; 
    font-size: 14px; 
    font-weight: 600; 
    line-height: 1.6;
    background: linear-gradient(90deg, #0ea5e9, #4f46e5, #d946ef);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.buttons {
    margin-top: 35px; 
    display: flex; 
    flex-direction: column; 
    gap: 20px;
}

/* Neumorphic Play Store Button */
.btn-playstore {
    display: flex; align-items: center; justify-content: center;
    background: #e0e5ec; text-decoration: none; border-radius: 12px;
    padding: 12px 20px; transition: 0.3s;
    box-shadow: 6px 6px 12px rgba(163,177,198,0.6), -6px -6px 12px rgba(255,255,255,0.8);
}
.btn-playstore:active {
    box-shadow: inset 5px 5px 10px rgba(163,177,198,0.6), inset -5px -5px 10px rgba(255,255,255,0.8);
}
.ps-icon { margin-right: 12px; display: flex; align-items: center; }
.ps-text { text-align: left; display: flex; flex-direction: column; }
.ps-text .small { font-size: 10px; font-weight: 600; letter-spacing: 1px; color: #555; text-transform: uppercase; }
.ps-text .big { font-size: 18px; font-weight: 700; font-family: Arial, sans-serif; color: #222; }

/* Neumorphic Browser Button */
.btn-browser {
    display: flex; align-items: center; justify-content: center;
    background: #e0e5ec; text-decoration: none; border-radius: 12px;
    padding: 15px 20px; font-size: 17px; font-weight: 700;
    transition: 0.3s;
    box-shadow: 6px 6px 12px rgba(163,177,198,0.6), -6px -6px 12px rgba(255,255,255,0.8);
}
.btn-browser:active {
    box-shadow: inset 5px 5px 10px rgba(163,177,198,0.6), inset -5px -5px 10px rgba(255,255,255,0.8);
}
.btn-browser .text-grad {
    background: linear-gradient(90deg, #ff007f, #7928ca);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}
.btn-browser .icon { margin-right: 10px; font-size: 20px; color: #ff007f; }

/* Multi-color Version Text */
.version {
    margin-top: 30px; 
    font-size: 15px; 
    font-weight: 700;
    background: linear-gradient(90deg, #34A853, #FBBC05, #EA4335, #4285F4);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}
.footer { margin-top: 10px; font-size: 12px; color: #999; font-weight: 500; }
</style>
</head>
<body>

<div class="card">
    <div class="logo">
        <img src="icon-192.png" alt="" onerror="this.style.display='none'">
        <div class="placeholder"> </div>
    </div>

    <h1>PRANTO GIFT CORNER</h1>
    
    <p class="subtitle">Download our official Android App for a faster and smoother shopping experience.</p>

    <div class="buttons">
        <!-- Play Store Style Neumorphic Button with Original Multi-color SVG Logo -->
        <a href="play store link" class="btn-playstore">
            <div class="ps-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24">
                    <!-- Blue part -->
                    <path fill="#4285F4" d="M2.9,2.4C2.5,2.7,2.3,3.3,2.3,4.2v15.6c0,0.8,0.2,1.5,0.6,1.8l0.1,0.1l8.7-8.7v-0.2L2.9,2.4z"/>
                    <!-- Yellow part -->
                    <path fill="#FBBC04" d="M11.6,12.7l3.1,3.1l0.1,0.1l3.6-2c1.1-0.6,1.1-1.6,0-2.2l-3.6-2l-0.1,0.1L11.6,12.7z"/>
                    <!-- Red part -->
                    <path fill="#EA4335" d="M3,2.4l8.7,8.7l3.1-3.1L3.9,1.7C3.5,1.5,3.1,1.6,3,2.4z"/>
                    <!-- Green part -->
                    <path fill="#34A853" d="M3,21.6c0.1,0.8,0.5,0.9,0.9,0.7l10.9-6.3l-3.1-3.1L3,21.6z"/>
                </svg>
            </div>
            <div class="ps-text">
                <span class="small">GET IT ON</span>
                <span class="big">Google Play</span>
            </div>
        </a>

        <!-- Browser Style Neumorphic Button -->
        <a href="apk link" class="btn-browser">
            <span class="icon">⬇</span> 
            <span class="text-grad">Download APK</span>
        </a>
    </div>

    <div class="version">Version 1.0.0</div>
    <div class="footer">© 2026 Pranto Gift Corner. All Rights Reserved.</div>
</div>

</body>
</html>
